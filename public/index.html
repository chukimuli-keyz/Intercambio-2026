<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1638">
<title>Intercambio Navideño</title>
<!--OG-->
<meta property="og:title" content="Intercambio Navideño">
<meta property="og:description" content="Sorteo navideño de intercambio de regalos. Elige un regalo y descubre a quién te toca regalar.">
<meta property="og:image" content="og.jpg">
<!--/OG-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='13' width='22' height='16' rx='2' fill='%23e0303f'/%3E%3Crect x='3' y='9' width='26' height='6' rx='2' fill='%23f04655'/%3E%3Crect x='14' y='9' width='4' height='20' fill='%23f5c451'/%3E%3Cpath d='M16 9c-3-6-10-5-7-1 2 2 5 1 7 1zm0 0c3-6 10-5 7-1-2 2-5 1-7 1z' fill='%23f5c451'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* VOICE: noche navideña elegante y juguetona, como app de temporada pulida.
   IDEA: seis cajas de regalo que rebotan, se agitan y se desenvuelven.
   PICTURE: regalos vectoriales con contorno y sombras planas, guirnalda de luces y pueblo nevado.
   COLOUR and TYPE: azul noche, oro de luces, rojo moño; Fraunces itálica + Nunito.
   LAYOUT: una columna centrada; la cuadrícula de regalos es la protagonista. */
:root{color-scheme:dark;--night:#0b1638;--gold:#f5c451;--red:#d92b3c;--text:#eef2ff;--muted:#a9b4dc;--line:rgba(255,255,255,.16);--panel:rgba(16,28,74,.74);--ink:#0a1230}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{position:relative;margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(140% 900px at 50% -10%,#1d3074 0%,#0e1a46 55%,transparent 100%) #0b1538;color:var(--text);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
.sky,#snow,#confetti{position:fixed;inset:0;pointer-events:none}
.sky{z-index:0}
#snow{z-index:1;width:100%;height:100%}
#confetti{z-index:35;width:100%;height:100%}
.st{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6}
.st.tw{animation:tw 2.6s ease-in-out infinite alternate}
.lights{position:absolute;top:0;left:50%;z-index:2;width:min(100%,640px);transform:translateX(-50%);pointer-events:none}
.lights svg{display:block;width:100%;height:auto;overflow:visible}
.bulb .bulbbody{animation:bulbBlink 1.6s ease-in-out calc(var(--i) * -.8s) infinite}
.village{position:absolute;left:0;right:0;bottom:0;height:140px;z-index:1;pointer-events:none}
.village svg{width:100%;height:100%;display:block}
main{position:relative;z-index:3;width:min(100%,660px);margin:0 auto;padding:0 16px 180px}
.center{text-align:center}

/* Encabezado */
.brand{text-align:center;padding-top:calc(min(100vw,640px) * .2 + 4px)}
h1{margin:0;font:800 clamp(42px,11.5vw,60px)/.92 Fraunces,Georgia,serif;letter-spacing:-.01em;text-wrap:balance}
h1 span{display:block;color:#fff}
h1 em{display:block;color:var(--gold);text-shadow:0 0 30px rgba(245,196,81,.3)}
.brand.compact h1{font-size:20px;line-height:1.2}
.brand.compact span,.brand.compact em{display:inline}
.sub{margin:12px 0 0;color:var(--muted);font-weight:700;font-size:17px}

/* Participante */
.hello{margin:14px 0 0;text-align:center;font-size:24px;line-height:1.2;color:#fff}
.hello+.sub{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px clamp(10px,4vw,24px);max-width:clamp(280px,42vh,360px);margin:18px auto 0}
.gb{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:24px;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gb:disabled{cursor:default}
.gb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gift{display:block;width:100%;height:100%;transform-origin:50% 88%;animation:bob 3s ease-in-out var(--d,0s) infinite}
.gift svg{display:block;width:100%;height:100%;overflow:visible}
.gb.free:active .gift{animation:none;transform:scale(1.14,.84)}
.gb.waiting .gift{animation:shake .5s ease-in-out infinite}
.gb.nope .gift{animation:nope .45s ease-in-out}
.gb.taken .gift{animation:none;opacity:.5;filter:grayscale(.8) brightness(.55)}
.gb.mine .gift{filter:drop-shadow(0 0 18px rgba(245,196,81,.55))}
.grid.picked .gb.free .gift{animation:none;opacity:.45;filter:saturate(.4) brightness(.6)}
.lock{position:absolute;left:50%;top:58%;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(8,16,44,.7);transform:translate(-50%,-50%)}
.lock svg{width:20px;height:20px;color:var(--muted)}
.tag-mine{position:absolute;left:50%;bottom:-2px;color:var(--gold);font-weight:800;font-size:14px;white-space:nowrap;transform:translateX(-50%)}
.hint{display:flex;flex-direction:column;align-items:center;gap:8px;margin:20px 0 0;text-align:center;font-weight:700;color:#dfe6ff}
.meta{margin:10px 0 0;color:var(--muted);font-weight:700;font-size:15px;text-align:center}
.meta:empty{display:none}
.meta.start{text-align:left}
.note.start{margin:0;text-align:left}
@media(hover:hover){.gb.free:hover .gift{animation:hoverUp .45s cubic-bezier(.3,1.6,.5,1) forwards}}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border:0;border-radius:999px;background:var(--gold);color:var(--ink);font:800 16px/1 Nunito,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25);transition:transform .16s cubic-bezier(.3,1.7,.5,1)}
.btn:hover{transform:translateY(-1px) scale(1.03,.97)}
.btn:active{transform:scale(1.08,.88)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn svg{width:20px;height:20px;flex:none}
.btn.lg{width:100%;min-height:58px;margin-top:20px;font-size:19px}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14px}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:rgba(255,255,255,.09);color:var(--text);box-shadow:none}

/* Paneles y formularios */
.panel{margin-top:22px;padding:clamp(18px,4vw,26px);border-radius:24px;background:var(--panel)}
h2{margin:0 0 14px;color:#fff;font:800 20px/1.2 Nunito,sans-serif}
.field{display:flex;align-items:center;gap:8px;padding:3px 6px 3px 10px;border:1.5px solid transparent;border-radius:16px;background:rgba(255,255,255,.07)}
.field:focus-within{border-color:var(--gold)}
.field b{color:var(--gold)}
.field[hidden]{display:none}
input{width:100%;min-height:46px;padding:0 6px;border:0;outline:0;background:transparent;color:var(--text);font:700 16px Nunito,sans-serif}
input::placeholder{color:#7d89b8}
.lab{display:block;margin:16px 0 6px;color:var(--muted);font-weight:800;font-size:14px}
h2+.lab{margin-top:0}
h2 small{color:var(--muted);font-size:15px;font-weight:700}
.addline{display:flex;gap:8px;margin-top:12px}
.addline .field{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.chip.new{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.count{margin:10px 0 0;text-align:center;font-weight:800;color:var(--gold)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices+.field{margin-top:10px}
.choice{min-height:44px;padding:8px 16px;border:0;border-radius:99px;background:rgba(255,255,255,.09);color:var(--text);font-weight:800;cursor:pointer}
.choice[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.choice.pressed{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.choice:focus-visible{outline:3px solid #fff;outline-offset:2px}
.note{margin:12px 0 0;color:var(--muted);font-size:14px;text-align:center}
.link{display:block;margin:18px auto 0;border:0;background:none;color:var(--gold);font-weight:800;text-decoration:underline;cursor:pointer}
.link.danger{color:#ff9a9a}
.draws{margin:0 0 10px;padding:0;list-style:none}
.draw{display:block;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.draws li:first-child .draw{border-top:0}
.draw b{display:block;color:#fff;overflow-wrap:anywhere}
.draw span{color:var(--muted);font-size:14px}
.draw:hover b{color:var(--gold)}
.draw:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Panel del organizador */
.counter{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.counter .n{color:var(--gold);font:800 64px/1 Fraunces,serif}
.counter .of{color:#fff;font:800 28px/1 Fraunces,serif}
.counter p{flex:1 1 180px;margin:0;color:var(--muted);font-weight:700}
.minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px}
.mini{aspect-ratio:1;filter:grayscale(1) brightness(.4);transition:filter .5s}
.mini.on{filter:none;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.mini svg{width:100%;height:100%;overflow:visible}
.people{margin:0;padding:0;list-style:none}
.person{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.av{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:18px}
.who b{display:block;font-size:17px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold)}
.pill.ok{color:#7fe3ad}
.pill.ok::before{background:#4ed88a}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.row>*{flex:1 1 200px}
.copyline{display:flex;gap:8px;margin-top:10px}
.copyline input{flex:1;font-size:14px;color:var(--muted)}

/* Revelación */
.reveal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;align-content:center;gap:20px;padding:20px;background:radial-gradient(circle at 50% 42%,rgba(22,40,100,.9),rgba(5,10,30,.95));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.reveal[hidden],.modal[hidden]{display:none}
.stage{position:relative;width:min(320px,76vw);padding-top:34%}
.rays{position:absolute;left:50%;top:52%;width:150%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,210,120,.32),transparent 62%);opacity:0;transform:translate(-50%,-50%) scale(.3);transition:opacity .5s,transform .8s cubic-bezier(.3,1.5,.5,1)}
.boxwrap{position:relative;aspect-ratio:1;transform-origin:50% 96%}
.boxwrap>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.boxwrap>.back{z-index:1}
.boxwrap>.front{z-index:4}
.boxwrap>.lid{z-index:5}
.lidg{transform-box:view-box;transform-origin:90px 60px}
.rcard{position:absolute;z-index:3;left:50%;bottom:22%;width:56%;padding:8px 12px 98px;border-radius:14px;background:#fbf4e6;color:#3b1d12;text-align:center;box-shadow:0 24px 50px rgba(0,0,0,.35);opacity:0;transform-origin:50% 100%;transform:translate(-50%,12%) scale(1.15,.4)}
.rcard p{margin:0;color:#8a6b55;font-weight:700;font-size:13px}
.rname{margin:2px 0 0;color:#1d6b4a;font:800 clamp(24px,7.5vw,34px)/1.05 Fraunces,serif;overflow-wrap:anywhere}
.rcard .rmeta{font-size:12px}
.rname+.rmeta{margin-top:8px}
.ractions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;opacity:0;transition:opacity .4s .9s}
.stage.in .boxwrap{animation:popIn .55s cubic-bezier(.3,1.3,.5,1)}
.stage.shake .boxwrap{animation:shake .38s ease-in-out 2}
.stage.burst .boxwrap{animation:burst .45s cubic-bezier(.3,1.4,.5,1)}
.stage.open .lidg{animation:lidFly .75s cubic-bezier(.2,.9,.3,1.15) forwards}
.stage.open .rcard{animation:cardUp 1.15s .08s ease-out forwards}
.stage.open .rays{opacity:1;transform:translate(-50%,-50%) scale(1)}
.stage.open+.ractions{opacity:1}

/* Utilidades */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(4,8,26,.7)}
.dlg{width:min(100%,400px);margin:0;text-align:center;background:#16245a;animation:popIn .45s cubic-bezier(.3,1.3,.5,1)}
.dlg p{margin:0;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;z-index:50;max-width:calc(100% - 32px);padding:12px 20px;border-radius:16px;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translate(-50%,calc(100% + 40px));transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
#toast.show{transform:translate(-50%,0)}
.sound{position:fixed;top:12px;right:12px;z-index:45;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:rgba(12,22,60,.7);cursor:pointer}
.sound svg{width:22px;height:22px}
.demo{position:relative;z-index:3;width:min(100% - 32px,620px);margin:-150px auto 0;padding:12px 16px;border-radius:18px;background:rgba(10,18,48,.85);color:var(--muted);font-size:14px;text-align:center}
.demo b{color:var(--gold)}
.demo .btn{margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@keyframes tw{from{opacity:.25}to{opacity:1}}
@keyframes bulbBlink{0%,44%{opacity:1}56%,100%{opacity:.5}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(.97,1.03)}80%{transform:translateY(0) scale(1.04,.96)}}
@keyframes hoverUp{50%{transform:translateY(-12px) scale(.93,1.09)}100%{transform:translateY(-7px) scale(1.02,.99)}}
@keyframes shake{0%,100%{transform:none}20%{transform:rotate(-7deg) scale(1.07,.93)}40%{transform:rotate(6deg) scale(.94,1.07)}60%{transform:rotate(-4deg) scale(1.04,.96)}80%{transform:rotate(3deg) scale(.98,1.02)}}
@keyframes nope{0%,100%{transform:none}20%{transform:translateX(-9px) scale(1.05,.95)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.3,1.6)}55%{transform:scale(1.2,.82)}80%{transform:scale(.95,1.05)}100%{transform:none}}
@keyframes popIn{0%{transform:scale(.15);opacity:0}45%{transform:scale(1.16,.84);opacity:1}65%{transform:scale(.92,1.1)}82%{transform:scale(1.04,.97)}100%{transform:none}}
@keyframes burst{40%{transform:scale(1.24,.72)}75%{transform:scale(.9,1.14)}100%{transform:none}}
@keyframes lidFly{0%{transform:none}25%{transform:translateY(-16px) scale(.86,1.2)}100%{transform:translate(52px,-84px) rotate(35.7deg)}}
@keyframes cardUp{0%{opacity:0;transform:translate(-50%,12%) scale(1.15,.4)}12%{opacity:1;transform:translate(-50%,10%) scale(1.22,.5)}38%{opacity:1;transform:translate(-50%,-16%) scale(.82,1.22)}56%{opacity:1;transform:translate(-50%,4%) scale(1.18,.82)}70%{opacity:1;transform:translate(-50%,-5%) scale(.93,1.08)}84%{opacity:1;transform:translate(-50%,1%) scale(1.04,.96)}100%{opacity:1;transform:translate(-50%,0)}}

@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));max-width:620px}}
@media(max-width:520px){.person{grid-template-columns:44px minmax(0,1fr)}.acts{grid-column:1/-1}.acts .btn{flex:1}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .stage.open .lidg{transform:translate(52px,-84px) rotate(35.7deg)}
  .stage.open .rcard{opacity:1;transform:translate(-50%,0)}
  .stage.open+.ractions{opacity:1}
}
</style>
</head>

<div class="sky" id="sky" aria-hidden="true"></div>

const S = {
  ctx: null,
  on: (() => { try { return localStorage.getItem("rm-sound") !== "0"; } catch (e) { return true; } })(),
  audio() {
    if (!this.on) return null;
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); }
    if (this.ctx.state === "suspended") this.ctx.resume();

  tone(f0, f1, dur, type, vol, delay = 0) {

    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.buffer = buf;

    g.gain.setValueAtTime(vol, t);

  },

  });

      p.vy += 0.32 * r; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;

const mock = (() => {
  const draws = new Map(), hex = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, "0")).join("");
  const res = async (status, data) => { await sleep(350); return { ok: status === 200, status, data }; };
  const derange = (n) => { let p; do { p = [...Array(n).keys()].sort(() => Math.random() - 0.5); } while (p.some((v, i) => v === i)); return p; };
  const who = (t) => { const s = draws.get(t.slice(0, 16)); return s ? [s, s.people.findIndex((p) => p.secret === t.slice(16))] : [null, -1]; };
  const snap = (s, i) => ({ me: s.people[i].name, date: s.date, budget: s.budget, gifts: s.slots.map((x) => (x === null ? "free" : x === i ? "mine" : "taken")), result: s.people[i].slot === null ? null : s.people[s.people[i].gives].name });
  return {
    create(b) {
      const id = hex(8), o = derange(SIZE);
      const s = { admin: hex(16), date: b.date, budget: b.budget === "" ? null : Number(b.budget), people: b.names.map((name, i) => ({ name, secret: hex(16), gives: o[i], slot: null })), slots: Array(SIZE).fill(null) };
      draws.set(id, s);
      return res(200, { admin: id + s.admin, people: s.people.map((p) => ({ name: p.name, token: id + p.secret })) });
    },
    admin(t) { const s = draws.get(t.slice(0, 16)); return !s || s.admin !== t.slice(16) ? res(404, { error: "not_found" }) : res(200, { date: s.date, budget: s.budget, people: s.people.map((p) => ({ name: p.name, secret: p.secret, done: p.slot !== null })) }); },
    close(t) { draws.delete(t.slice(0, 16)); return res(200, { ok: true }); },
    view(t) { const [s, i] = who(t); return i < 0 ? res(404, { error: "not_found" }) : res(200, snap(s, i)); },
    pick(t, slot) {
      const [s, i] = who(t);
      if (i < 0) return res(404, { error: "not_found" });
      if (s.people[i].slot !== null) return res(200, snap(s, i));
      if (s.slots[slot] !== null) return res(409, { error: "taken", ...snap(s, i) });
      s.slots[slot] = i; s.people[i].slot = slot;
      return res(200, snap(s, i));
    },
    simulate(adminToken) {
      const s = draws.get(adminToken.slice(0, 16)); if (!s) return null;
      const free = s.slots.map((x, k) => (x === null ? k : -1)).filter((k) => k >= 0), pend = s.people.map((p, k) => (p.slot === null ? k : -1)).filter((k) => k >= 0);
      if (!pend.length) return null;
      const i = pend[(Math.random() * pend.length) | 0], k = free[(Math.random() * free.length) | 0];
      s.slots[k] = i; s.people[i].slot = k;
      return s.people[i].name;
    },
  };
})();

    if (!input.disabled) input.focus();
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (clean(input.value)) add(input.value); } });
  input.addEventListener("paste", (e) => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (/[\n,;]/.test(text)) { e.preventDefault(); add(text); }
  });
  $("#addBtn").addEventListener("click", () => (clean(input.value) ? add(input.value) : input.focus()));
  $("#chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-rm]");
    if (!b) return;
    names.splice(Number(b.dataset.rm), 1);
    S.tick();
    paint();
  });
  $("#budget").addEventListener("click", (e) => {
    const b = e.target.closest(".choice");
    if (!b) return;
    $("#budget").querySelectorAll(".choice").forEach((c) => c.setAttribute("aria-pressed", c === b));
    replay(b, "pressed");
    S.tick();
    $("#otherWrap").hidden = b.dataset.b !== "otro";
    if (b.dataset.b === "otro") $("#otherIn").focus();
  });
  $("#goBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget, pick = $("#budget").querySelector('[aria-pressed="true"]').dataset.b;
    const budget = pick === "otro" ? $("#otherIn").value : pick, date = $("#dateIn").value;
    btn.disabled = true;
    S.boing();
    const r = await api.create({ names, date, budget });
    if (!r.ok) { btn.disabled = false; S.bonk(); toast("No se pudo crear el sorteo. Intenta de nuevo."); return; }
    myDraws.put(r.data.admin, names, date);
    toast("¡Sorteo listo! Ahora copia cada enlace");
    nav("/admin/" + r.data.admin, true);
  });
  paint();
  input.focus();
};

/* ---------- Vista: panel del organizador ---------- */
const adminView = async (t) => {
  app.innerHTML = hdr("Panel del organizador") + '<div class="panel center" id="adm"><p class="note">Cargando…</p></div>';
  let last = "";
  const load = async () => {
    const r = await api.admin(t);
    if (path !== "/admin/" + t) return;
    if (!r.ok) { clearInterval(timer); if (r.status === 404) { myDraws.remove(t); errorView("Este sorteo ya no existe", true); } return; }
    myDraws.put(t, r.data.people.map((p) => p.name), r.data.date);
    const key = JSON.stringify(r.data);
    if (key !== last) { last = key; paintAdmin(t, r.data); }
  };
  await load();
  every(load, 5000);
};
const paintAdmin = (t, d) => {
  const done = d.people.filter((p) => p.done).length;
  const rows = d.people.map((p, i) => `<li class="person"><span class="av" style="--c:${GIFTS[i].base}">${esc(p.name.charAt(0).toUpperCase())}</span>
      <div class="who"><b>${esc(p.name)}</b><span class="pill ${p.done ? "ok" : "wait"}">${p.done ? "Sorteo realizado" : "Pendiente"}</span></div>
      <div class="acts"><button class="btn ghost sm" type="button" data-copy="${i}" aria-label="Copiar enlace de ${esc(p.name)}"><svg><use href="#i-copy"/></svg>Copiar enlace</button>${DEMO ? `<button class="btn ghost sm" type="button" data-open="${i}">Abrir</button>` : ""}</div></li>`).join("");
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <section class="panel">
      <div class="counter"><span class="n">${done}</span><span class="of">de ${SIZE}</span><p>${done === SIZE ? "¡Todos ya eligieron su regalo!" : "participantes ya eligieron su regalo"}</p></div>
      <div class="minis">${GIFTS.map((_, i) => `<span class="mini${i < done ? " on" : ""}">${giftSVG(i)}</span>`).join("")}</div>
      <p class="meta start">${esc(metaText(d))}</p>
    </section>
    <section class="panel"><h2>Enlaces individuales</h2><p class="note start">Copia el enlace de cada persona y mándaselo por WhatsApp.</p><ul class="people">${rows}</ul>
      <div class="row"><button class="btn ghost" type="button" id="copyAll"><svg><use href="#i-copy"/></svg>Copiar todos los enlaces</button></div>
    </section>
    <section class="panel"><h2>Enlace de tu panel</h2><p class="note start">Este dispositivo lo recuerda en “Mis sorteos”. Guárdalo para abrirlo desde otro celular o computadora. No muestra quién le tocó a quién.</p>
      <div class="copyline"><input readonly aria-label="Enlace del panel" value="${esc((DEMO ? "https://intercambio-2026.tu-cuenta.workers.dev" : location.origin) + "/admin/" + t)}"><button class="btn ghost sm" type="button" id="copyAdmin">Copiar enlace</button></div>
    </section>
    <div class="row"><button class="btn ghost" type="button" data-nav="/nuevo">Crear otro sorteo</button></div>
    <button class="link danger" type="button" id="delDraw">Borrar este sorteo</button>`;
  const adm = $("#adm");
  if (adm) adm.replaceWith(...wrap.children);
  else { const h = app.querySelector(".brand"); while (h.nextSibling) h.nextSibling.remove(); app.append(...wrap.children); }
  app.onclick = async (e) => {
    const b = e.target.closest("button,a");
    if (!b) return;
    if (b.dataset.copy) copy(linkFor(t.slice(0, 16) + d.people[b.dataset.copy].secret));
    else if (b.dataset.open) nav("/p/" + t.slice(0, 16) + d.people[b.dataset.open].secret);
    else if (b.id === "copyAll") copy(d.people.map((p) => `${p.name}: ${linkFor(t.slice(0, 16) + p.secret)}`).join("\n"), "Los seis enlaces se copiaron");
    else if (b.id === "copyAdmin") copy(b.previousElementSibling.value, "Enlace del panel copiado");
    else if (b.id === "delDraw") {
      if (!(await ask())) return;
      const r = await api.close(t);
      if (!r.ok) { S.bonk(); toast("No se pudo borrar. Intenta de nuevo."); return; }
      myDraws.remove(t);
      toast("Sorteo borrado");
      nav("/", true);
    }
  };
};

/* ---------- Vista: participante ---------- */
let P = null, busy = false;
const partView = async (t) => {
  P = null;
  app.innerHTML = hdrMini() + `
    <p class="hello" id="hello">&nbsp;</p>
    <p class="sub center">Elige un regalo</p>
    <div class="grid" id="grid">${GIFTS.map((_, i) => `<button class="gb" type="button" disabled style="--d:${(i * -0.43).toFixed(2)}s"><span class="gift">${giftSVG(i)}</span></button>`).join("")}</div>
    <div id="hint"></div><p class="meta" id="ptags"></p>`;
  const r = await api.view(t);
  if (path !== "/p/" + t) return;
  if (!r.ok) { errorView(r.status === 404 ? "Este enlace no existe o el sorteo se cerró" : "No pudimos cargar tu regalo"); return; }
  P = { t, d: r.data, key: "" };
  $("#hello").innerHTML = `Hola, <b>${esc(P.d.me)}</b>`;
  $("#ptags").textContent = metaText(P.d);
  paintGrid();
  $("#grid").addEventListener("click", onPick);
  if (P.d.result) setTimeout(() => openReveal(P.d.gifts.indexOf("mine")), 500);
  every(async () => {
    if (busy || !P || P.d.result || !$("#reveal").hidden) return;
    const v = await api.view(t);
    if (v.ok && P && P.t === t) { P.d = v.data; paintGrid(); }
  }, 4000);
};
const paintGrid = () => {
  const key = P.d.gifts.join() + P.d.result;
  if (key === P.key) return;
  P.key = key;
  const grid = $("#grid");
  grid.classList.toggle("picked", !!P.d.result);
  grid.innerHTML = P.d.gifts.map((st, i) => {
    const label = st === "taken" ? "Regalo ya elegido por alguien más" : st === "mine" ? "Tu regalo" : `Regalo ${i + 1}`;
    return `<button class="gb ${st}" type="button" data-slot="${i}" aria-label="${label}" ${st !== "free" || P.d.result ? "disabled" : ""} style="--d:${(i * -0.43).toFixed(2)}s"><span class="gift">${giftSVG(i)}</span>${st === "taken" ? '<span class="lock"><svg><use href="#i-lock"/></svg></span>' : ""}${st === "mine" ? '<span class="tag-mine">Tu regalo</span>' : ""}</button>`;
  }).join("");
  $("#hint").innerHTML = P.d.result
    ? `<p class="hint">Ya elegiste tu regalo. Tu resultado no cambia.</p><div class="center" style="margin-top:12px"><button class="btn" type="button" id="seeAgain"><svg><use href="#i-refresh"/></svg>Ver mi resultado</button></div>`
    : `<p class="hint">Toca un regalo para descubrir<br>a quién te toca regalar</p>`;
  const again = $("#seeAgain");
  if (again) again.addEventListener("click", () => openReveal(P.d.gifts.indexOf("mine")));
};
const onPick = async (e) => {
  const btn = e.target.closest(".gb");
  if (!btn || btn.disabled || busy || !P || P.d.result) return;
  busy = true;
  const slot = Number(btn.dataset.slot);
  S.boing();
  $("#grid").querySelectorAll(".gb").forEach((b) => (b.disabled = true));
  btn.classList.add("waiting");
  S.rattle();
  const [r] = await Promise.all([api.pick(P.t, slot), sleep(reduce ? 0 : 800)]);
  btn.classList.remove("waiting");
  busy = false;
  if (r.ok) {
    P.d = r.data;
    paintGrid();
    openReveal(P.d.gifts.indexOf("mine"));
  } else if (r.status === 409) {
    S.bonk();
    btn.classList.add("nope");
    toast("¡Alguien más eligió ese regalo! Escoge otro.");
    await sleep(450);
    if (r.data.gifts) P.d = { ...P.d, gifts: r.data.gifts, result: r.data.result };
    P.key = "";
    paintGrid();
  } else {
    S.bonk();
    toast(r.status === 0 ? "Sin conexión. Intenta de nuevo." : "Algo salió mal. Intenta de nuevo.");
    P.key = "";
    paintGrid();
  }
};

/* ---------- Revelación con squash & stretch ---------- */
const R = $("#reveal");
let playing = 0;
const openReveal = (slot) => {
  if (slot < 0) return;
  R.innerHTML = `<div class="stage" id="stage"><div class="rays"></div><div class="boxwrap">${giftSVG(slot, "back")}
    <div class="rcard"><p>Le regalas a</p><div class="rname">${esc(P.d.result)}</div>${metaParts(P.d).map((x) => `<p class="rmeta">${esc(x)}</p>`).join("")}</div>
    ${giftSVG(slot, "front")}${giftSVG(slot, "lid")}</div></div>
    <div class="ractions"><button class="btn" type="button" id="replay"><svg><use href="#i-refresh"/></svg>Ver de nuevo</button><button class="btn ghost" type="button" id="closeR">Cerrar</button></div>`;
  R.hidden = false;
  $("#replay").addEventListener("click", play);
  $("#closeR").addEventListener("click", closeReveal);
  play();
};
const closeReveal = () => { playing++; R.hidden = true; R.innerHTML = ""; };
async function play() {
  const run = ++playing, st = $("#stage"), set = (c) => { st.className = "stage " + c; };
  if (reduce) { set("open"); return; }
  set(""); void st.offsetWidth;
  set("in"); S.boing();
  await sleep(560); if (run !== playing) return;
  set("shake"); S.rattle();
  await sleep(780); if (run !== playing) return;
  set("burst");
  await sleep(180); if (run !== playing) return;
  set("burst open"); S.pop();
  setTimeout(() => run === playing && S.jingle(), 180);
  const b = st.getBoundingClientRect();
  confetti(b.left + b.width / 2, b.top + b.height * 0.4);
}
addEventListener("keydown", (e) => { if (e.key === "Escape" && !R.hidden) closeReveal(); });

/* ---------- Enrutador ---------- */
function render() {
  clearInterval(timer);
  app.onclick = null;
  closeReveal();
  scrollTo(0, 0);
  const m = path.match(TOKEN_PATH);
  if (m && m[1] === "p") partView(m[2]);
  else if (m) adminView(m[2]);
  else if (path === "/nuevo" || !myDraws.all().length) createView();
  else homeView();
  paintDemo();
}
document.addEventListener("click", (e) => {
  const n = e.target.closest("[data-nav]");
  if (n) { e.preventDefault(); S.tick(); nav(n.dataset.nav); }
});
addEventListener("popstate", () => { if (!DEMO) { path = location.pathname; render(); } });

const paintDemo = () => {
  const el = $("#demo");
  if (!DEMO) { el.innerHTML = ""; return; }
  const a = myDraws.all()[0]?.t, m = path.match(TOKEN_PATH);
  el.innerHTML = `<div class="demo"><b>Vista previa.</b> Aquí los datos viven solo en esta pestaña; en tu servidor se guardan en la base de datos compartida.
    ${a ? `<div class="row" style="margin-top:4px">${m && m[1] === "p" ? `<button class="btn ghost sm" type="button" data-nav="/admin/${esc(a)}">Ir al panel</button>` : ""}<button class="btn ghost sm" type="button" id="sim">Simular que otra persona elige</button></div>` : ""}</div>`;
  const sim = $("#sim");
  if (sim) sim.addEventListener("click", () => {
    const name = mock.simulate(a);
    if (!name) { toast("Ya eligieron todos"); return; }
    S.tick();
    toast(`${name} acaba de elegir un regalo`);
    if (P && !P.d.result) api.view(P.t).then((v) => { if (v.ok) { P.d = v.data; paintGrid(); } });
    else if (path.startsWith("/admin/")) adminView(a);
  });
};

/* ---------- Inicio ---------- */
(async () => {
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 2500);
  try {
    const r = await fetch("/api/health", { cache: "no-store", signal: ctrl.signal });
    DEMO = !(r.ok && (await r.json()).ok === true);
  } catch (e) { DEMO = true; }
  clearTimeout(to);
  if (DEMO) { api = mock; path = "/"; }
  else path = location.pathname;
  render();
})();
}
</script>
</body>
